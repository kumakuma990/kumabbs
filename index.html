<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みんなの掲示板</title>
  <style>
    /* マイメロ風カラーの設定 */
    :root {
      --bg-color: #fff0f5;          /* ミルキーピンク（全体の背景） */
      --card-bg: #ffffff;           /* 白（カード・差し色） */
      --primary-color: #ffb6c1;      /* イチゴミルクピンク（メイン・ボタン） */
      --primary-hover: #ff9aa2;      /* ボタンを押した時のピンク */
      --text-color: #4a3525;         /* こげ茶（メイン文字色） */
      --sub-text-color: #8c7365;     /* 薄いこげ茶（サブ文字色） */
      --border-color: #fce4ec;       /* 枠線の淡いピンク */
      --like-color: #ff6b81;         /* いいねボタンの色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px 10px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--text-color);
      margin-bottom: 5px;
    }

    header p {
      color: var(--sub-text-color);
      font-size: 0.9rem;
    }

    /* 投稿フォーム */
    .post-form {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(74, 53, 37, 0.05);
      margin-bottom: 25px;
      border: 2px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--text-color);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-color);
      outline: none;
      background-color: #fafafa;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* 検索ボックス */
    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 15px;
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--text-color);
      outline: none;
      background-color: var(--card-bg);
    }

    /* 投稿一覧 */
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .post-card {
      background-color: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(74, 53, 37, 0.04);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .post-author-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .post-author {
      font-weight: bold;
      font-size: 0.95rem;
      color: var(--text-color);
    }

    .post-userid {
      font-size: 0.75rem;
      color: var(--sub-text-color);
      background-color: var(--bg-color);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .post-date {
      font-size: 0.75rem;
      color: var(--sub-text-color);
    }

    .post-content {
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 15px;
      color: var(--text-color);
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .like-btn {
      background: none;
      border: none;
      color: var(--like-color);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    .like-btn:hover {
      background-color: #fff0f5;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--sub-text-color);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .delete-btn:hover {
      color: #e53935;
      background-color: #ffebee;
    }

    .empty-message {
      text-align: center;
      color: var(--sub-text-color);
      padding: 30px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>(⋈◍＞◡＜◍)。✧♡ みんなの掲示板°˖✧</h1>
      <p>自由に書き込んでね！</p>
    </header>

    <!-- 投稿フォーム -->
    <div class="post-form">
      <div class="form-group">
        <label for="username">お名前</label>
        <!-- 最初から「名無しさん」が入るように value を追加 -->
        <input type="text" id="username" value="名無しさん" placeholder="名無しさん" maxlength="20">
      </div>
      <div class="form-group">
        <label for="content">メッセージ</label>
        <textarea id="content" placeholder="ここにメッセージを入力してね..." rows="3"></textarea>
      </div>
      <button class="submit-btn" onclick="addPost()">投稿する</button>
    </div>

    <!-- 検索バー -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="投稿を検索..." oninput="filterPosts()">
    </div>

    <!-- 投稿一覧 -->
    <div class="post-list" id="postList">
      <!-- ここに投稿が追加されます -->
    </div>
  </div>

  <script>
    // ブラウザごとの固有IDを自動生成（まだなければ作る）
    let myUserId = localStorage.getItem('my_bbs_userid');
    if (!myUserId) {
      myUserId = Math.random().toString(36).substring(2, 8); // 6文字のランダムID
      localStorage.setItem('my_bbs_userid', myUserId);
    }

    // ローカルストレージから投稿データを取得
    let posts = JSON.parse(localStorage.getItem('my_bbs_posts')) || [];

    // 初期表示
    renderPosts();

    // 投稿を追加する関数
    function addPost() {
      const usernameInput = document.getElementById('username');
      const contentInput = document.getElementById('content');

      const username = usernameInput.value.trim() || '名無しさん';
      const content = contentInput.value.trim();

      if (!content) {
        alert('メッセージを入力してね！');
        return;
      }

      const now = new Date();
      const dateString = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newPost = {
        id: Date.now(),
        username: username,
        content: content,
        date: dateString,
        userId: myUserId, // 自動で作ったIDを持たせる
        likes: 0
      };

      posts.unshift(newPost); // 新しい投稿を先頭に追加
      saveAndRender();

      // フォームをクリア（名前は「名無しさん」に戻す）
      contentInput.value = '';
      usernameInput.value = '名無しさん';
    }

    // いいねを増やす関数
    function likePost(id) {
      posts = posts.map(post => {
        if (post.id === id) {
          return { ...post, likes: post.likes + 1 };
        }
        return post;
      });
      saveAndRender();
    }

    // 投稿を削除する関数
    function deletePost(id) {
      if (confirm('この投稿を削除してもいい？')) {
        posts = posts.filter(post => post.id !== id);
        saveAndRender();
      }
    }

    // 投稿を保存して再描画する関数
    function saveAndRender() {
      localStorage.setItem('my_bbs_posts', JSON.stringify(posts));
      renderPosts();
    }

    // 投稿一覧を描画する関数
    function renderPosts(filterText = '') {
      const postList = document.getElementById('postList');
      postList.innerHTML = '';

      const filteredPosts = posts.filter(post => 
        post.username.toLowerCase().includes(filterText.toLowerCase()) ||
        post.content.toLowerCase().includes(filterText.toLowerCase()) ||
        (post.userId && post.userId.toLowerCase().includes(filterText.toLowerCase()))
      );

      if (filteredPosts.length === 0) {
        postList.innerHTML = '<div class="empty-message">投稿がまだないよ。最初の投稿をしてみてね！</div>';
        return;
      }

      filteredPosts.forEach(post => {
        const postCard = document.createElement('div');
        postCard.className = 'post-card';
        // IDが古いデータに無い場合の対策として、なければ「----」にする
        const displayUserId = post.userId ? post.userId : '----';

        postCard.innerHTML = `
          <div class="post-header">
            <div class="post-author-area">
              <span class="post-author">${escapeHtml(post.username)}</span>
              <span class="post-userid">ID:${displayUserId}</span>
            </div>
            <span class="post-date">${post.date}</span>
          </div>
          <div class="post-content">${escapeHtml(post.content)}</div>
          <div class="post-footer">
            <button class="like-btn" onclick="likePost(${post.id})">
              ♥ いいね ${post.likes}
            </button>
            <button class="delete-btn" onclick="deletePost(${post.id})">削除</button>
          </div>
        `;
        postList.appendChild(postCard);
      });
    }

    // 検索フィルター
    function filterPosts() {
      const searchInput = document.getElementById('searchInput').value;
      renderPosts(searchInput);
    }

    // 文字列のエスケープ処理（セキュリティ対策）
    let escapeHtml = (str) => {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
