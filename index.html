<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みんなの掲示板</title>
  <style>
    :root {
      --bg-color: #fff0f5;
      --card-bg: #ffffff;
      --primary-color: #ffb6c1;
      --primary-hover: #ff9aa2;
      --text-color: #4a3525;
      --sub-text-color: #8c7365;
      --border-color: #fce4ec;
      --like-color: #ff6b81;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial,
        'Hiragino Kaku Gothic ProN', 'Hiragino Sans',
        Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px 10px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    header p {
      color: var(--sub-text-color);
      font-size: 0.9rem;
    }

    .post-form {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(74, 53, 37, 0.05);
      margin-bottom: 25px;
      border: 2px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-color);
      outline: none;
      background: #fafafa;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary-color);
      background: #fff;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 15px;
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--text-color);
      outline: none;
      background: var(--card-bg);
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .post-card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(74, 53, 37, 0.04);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .post-author-area {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .post-author {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .post-userid {
      font-size: 0.75rem;
      color: var(--sub-text-color);
      background: var(--bg-color);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .post-date {
      font-size: 0.75rem;
      color: var(--sub-text-color);
    }

    .post-content {
      font-size: 0.95rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-bottom: 15px;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .like-btn,
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .like-btn {
      color: var(--like-color);
      font-size: 0.9rem;
      font-weight: bold;
    }

    .like-btn:hover {
      background: #fff0f5;
    }

    .like-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .delete-btn {
      color: var(--sub-text-color);
      font-size: 0.8rem;
    }

    .delete-btn:hover {
      color: #e53935;
      background: #ffebee;
    }

    .empty-message {
      text-align: center;
      color: var(--sub-text-color);
      padding: 30px;
      font-size: 0.9rem;
    }

    .status-message {
      text-align: center;
      color: var(--sub-text-color);
      font-size: 0.85rem;
      margin: 0 0 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>(⋈◍＞◡＜◍)。✧♡ みんなの掲示板°˖✧</h1>
      <p>自由に書き込んでね！</p>
    </header>

    <div class="post-form">
      <div class="form-group">
        <label for="username">お名前</label>
        <input
          type="text"
          id="username"
          value="名無しさん"
          placeholder="名無しさん"
          maxlength="20"
        >
      </div>

      <div class="form-group">
        <label for="content">メッセージ</label>
        <textarea
          id="content"
          placeholder="ここにメッセージを入力してね..."
          rows="3"
          maxlength="2000"
        ></textarea>
      </div>

      <button class="submit-btn" id="submitBtn" disabled>
        接続中...
      </button>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="投稿を検索..."
      >
    </div>

    <p class="status-message" id="statusMessage">
      掲示板に接続しています...
    </p>

    <div class="post-list" id="postList"></div>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  updateDoc,
  deleteDoc,
  doc,
  getDoc,
  increment,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYQ5-8eknVbvYUgbVUGyNZFepdxri6X0Q",
      authDomain: "kumakuma-bbs.firebaseapp.com",
      projectId: "kumakuma-bbs",
      storageBucket: "kumakuma-bbs.firebasestorage.app",
      messagingSenderId: "401967562022",
      appId: "1:401967562022:web:a65134b94d8f571ecb95e7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const postsCollection = collection(db, "posts");

    const usernameInput = document.getElementById("username");
    const contentInput = document.getElementById("content");
    const submitBtn = document.getElementById("submitBtn");
    const searchInput = document.getElementById("searchInput");
    const postList = document.getElementById("postList");
    const statusMessage = document.getElementById("statusMessage");

    let currentUser = null;
    let isAdmin = false;
    let posts = [];
    let busyLikes = new Set();
    let busyDeletes = new Set();

    let myUserId = localStorage.getItem("my_bbs_userid");

    if (!myUserId) {
      myUserId = Math.random().toString(36).slice(2, 8);
      localStorage.setItem("my_bbs_userid", myUserId);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function formatDate(timestamp) {
      if (!timestamp || typeof timestamp.toDate !== "function") {
        return "日時を取得中...";
      }

      const date = timestamp.toDate();

      return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${
        String(date.getHours()).padStart(2, "0")
      }:${
        String(date.getMinutes()).padStart(2, "0")
      }`;
    }

    function setStatus(message) {
      statusMessage.textContent = message;
    }

    function filterPosts() {
      renderPosts(searchInput.value);
    }

    function renderPosts(filterText = "") {
      postList.replaceChildren();

      const term = filterText.trim().toLowerCase();

      const filteredPosts = posts.filter(post =>
        String(post.username ?? "").toLowerCase().includes(term) ||
        String(post.content ?? "").toLowerCase().includes(term) ||
        String(post.userId ?? "").toLowerCase().includes(term)
      );

      if (filteredPosts.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = term
          ? "検索に一致する投稿がないよ。"
          : "投稿がまだないよ。最初の投稿をしてみてね！";
        postList.appendChild(empty);
        return;
      }

      for (const post of filteredPosts) {
        const card = document.createElement("div");
        card.className = "post-card";

        const canDelete =
  !!currentUser &&
  (isAdmin || post.ownerUid === currentUser.uid);

        card.innerHTML = `
          <div class="post-header">
            <div class="post-author-area">
              <span class="post-author">${escapeHtml(post.username)}</span>
              <span class="post-userid">ID:${escapeHtml(post.userId || "----")}</span>
            </div>
            <span class="post-date">${escapeHtml(formatDate(post.createdAt))}</span>
          </div>
          <div class="post-content">${escapeHtml(post.content)}</div>
          <div class="post-footer">
            <button class="like-btn" type="button">
              ♥ いいね ${Number(post.likes) || 0}
            </button>
            ${
              canDelete
                ? '<button class="delete-btn" type="button">削除</button>'
                : '<span></span>'
            }
          </div>
        `;

        const likeButton = card.querySelector(".like-btn");
        likeButton.disabled = busyLikes.has(post.id);
        likeButton.addEventListener("click", () => likePost(post.id));

        if (canDelete) {
          const deleteButton = card.querySelector(".delete-btn");
          deleteButton.disabled = busyDeletes.has(post.id);
          deleteButton.addEventListener("click", () => deletePost(post.id));
        }

        postList.appendChild(card);
      }
    }

    async function addPost() {
      if (!currentUser) {
        alert("接続中だよ。少し待ってからもう一度試してね！");
        return;
      }

      const username = usernameInput.value.trim() || "名無しさん";
      const content = contentInput.value.trim();

      if (!content) {
        alert("メッセージを入力してね！");
        contentInput.focus();
        return;
      }

      if (content.length > 2000) {
        alert("メッセージは2000文字以内にしてね！");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "投稿中...";

      try {
        await addDoc(postsCollection, {
          username: username.slice(0, 20),
          content,
          userId: myUserId,
          ownerUid: currentUser.uid,
          likes: 0,
          createdAt: serverTimestamp()
        });

        contentInput.value = "";
        usernameInput.value = "名無しさん";
        setStatus("投稿できたよ！🩷");
      } catch (error) {
        console.error(error);
        alert("投稿できなかったよ。接続やルールの設定を確認してね。");
        setStatus("投稿に失敗しました。設定を確認してね。");
      } finally {
        submitBtn.disabled = !currentUser;
        submitBtn.textContent = "投稿する";
      }
    }

    async function likePost(id) {
      if (!currentUser || busyLikes.has(id)) return;

      busyLikes.add(id);
      renderPosts(searchInput.value);

      try {
        await updateDoc(doc(db, "posts", id), {
          likes: increment(1)
        });
      } catch (error) {
        console.error(error);
        alert("いいねできなかったよ。もう一度試してね。");
      } finally {
        busyLikes.delete(id);
        renderPosts(searchInput.value);
      }
    }

    async function deletePost(id) {
      const post = posts.find(item => item.id === id);

if (
  !post ||
  !currentUser ||
  (!isAdmin && post.ownerUid !== currentUser.uid)
) {
  alert("自分の投稿だけ削除できるよ。");
  return;
}

      if (!confirm("この投稿を削除してもいい？")) return;

      busyDeletes.add(id);
      renderPosts(searchInput.value);

      try {
        await deleteDoc(doc(db, "posts", id));
      } catch (error) {
        console.error(error);
        alert("削除できなかったよ。もう一度試してね。");
      } finally {
        busyDeletes.delete(id);
        renderPosts(searchInput.value);
      }
    }

    submitBtn.addEventListener("click", addPost);
    searchInput.addEventListener("input", filterPosts);

        onAuthStateChanged(auth, async user => {
      if (!user) {
        currentUser = null;
        submitBtn.disabled = true;

        try {
          await signInAnonymously(auth);
        } catch (error) {
          console.error(error);
          setStatus("接続できません。匿名認証の設定を確認してね。");
        }

        return;
      }

currentUser = user;
          console.log("管理人登録用UID:", user.uid);

try {
const adminIds = ["admin", "pc"];
isAdmin = false;

for (const adminId of adminIds) {
  const adminDoc = await getDoc(
    doc(db, "admins", adminId)
  );

if (
  adminDoc.exists() &&
  adminDoc.data().uid === user.uid
) {
  isAdmin = true;
  console.log("管理人として認識されたよ！");
  break;
}
}
} catch (error) {
  console.error(error);
  isAdmin = false;
}

submitBtn.disabled = false;
submitBtn.textContent = "投稿する";
      const postsQuery = query(
        postsCollection,
        orderBy("createdAt", "desc")
      );

      onSnapshot(postsQuery, snapshot => {
        posts = snapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        }));

        renderPosts(searchInput.value);
        setStatus("みんなの掲示板に接続中だよ！🩷");
      }, error => {
        console.error(error);
        setStatus("投稿を読み込めません。Firestoreのルールを確認してね。");
      });
    });
  </script>
</body>
</html>
