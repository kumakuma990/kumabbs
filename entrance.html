
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♡ あてんしょん ♡</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px 40px;
      background: #FFF0F5;
      color: #8D536B;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic",
                   Meiryo, sans-serif;
      line-height: 1.8;
    }

    button, select {
      font: inherit;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
    }

    .decoration {
      text-align: center;
      color: #D987A8;
      letter-spacing: 5px;
      margin: 8px 0;
    }

    .card {
      background: #FFFFFF;
      border: 2px solid #F5D5E2;
      border-radius: 22px;
      padding: 26px 20px;
      box-shadow: 0 7px 0 #F6DDE7;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      color: #D77FA1;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      margin: 4px 0 24px;
      color: #B77B94;
    }

    .mascot-placeholder {
      width: 100px;
      height: 100px;
      margin: 0 auto 14px;
      border: 2px dashed #EFC4D5;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #D99AB3;
      background: #FFF8FB;
      font-size: 13px;
      text-align: center;
    }

    .question {
      margin: 22px 0;
    }

    .question-title {
      display: block;
      font-weight: bold;
      margin-bottom: 9px;
      color: #B96588;
    }

    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #EBC5D5;
      border-radius: 12px;
      background: #FFF8FB;
      color: #8D536B;
      outline-color: #D987A8;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice {
      flex: 1 1 auto;
      min-width: 90px;
      padding: 9px 12px;
      border: 1px solid #EBC5D5;
      border-radius: 14px;
      background: #FFFFFF;
      color: #A65F7D;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .choice[aria-pressed="true"] {
      background: #F6C9DB;
      border-color: #E49AB8;
      color: #79415A;
      font-weight: bold;
    }

    .rule {
      padding: 15px;
      background: #FFF5F9;
      border: 1px solid #F4D8E4;
      border-radius: 14px;
      text-align: center;
    }

    .rule p {
      margin: 0 0 12px;
      font-weight: bold;
    }

    .enter-button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 999px;
      background: #E99BB9;
      color: #FFFFFF;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #D77FA1;
    }

    .enter-button:hover {
      background: #E38EAF;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #FFF5F9;
      text-align: center;
    }

    .message h2 {
      color: #D77FA1;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #B98BA0;
      margin-top: 24px;
    }

    @media (max-width: 380px) {
      .card {
        padding: 22px 14px;
      }

      h1 {
        font-size: 26px;
      }

      .choice {
        min-width: 75px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="decoration">♡ ✧ ♡ ✧ ♡</div>

    <section class="card" id="entrance">
      <div class="mascot-placeholder" aria-label="うさぎ画像の予定地">
        うさぎちゃん<br>あとで追加♡
      </div>

      <h1>♡ あてんしょん ♡</h1>
      <p class="subtitle">簡単なアンケートのお願い♡</p>

      <form id="entry-form">
        <div class="question">
          <label class="question-title" for="birth-year">
            ✧ 生まれ年は？
          </label>
          <select id="birth-year" required>
            <option value="">選んでね♡</option>
            <option value="before1970">1960年代以前</option>
          </select>
        </div>

        <div class="question">
          <span class="question-title">✧ 性別は？</span>
          <div class="choices" id="gender-choices">
            <button class="choice" type="button" data-group="gender"
              data-value="女の子" aria-pressed="false">女の子</button>
            <button class="choice" type="button" data-group="gender"
              data-value="男の子" aria-pressed="false">男の子</button>
            <button class="choice" type="button" data-group="gender"
              data-value="その他" aria-pressed="false">その他</button>
            <button class="choice" type="button" data-group="gender"
              data-value="答えない" aria-pressed="false">答えない</button>
          </div>
        </div>

        <div class="question">
          <span class="question-title">✧ 犬派？猫派？</span>
          <div class="choices">
            <button class="choice" type="button" data-group="pet"
              data-value="dog" aria-pressed="false">🐶 犬派</button>
            <button class="choice" type="button" data-group="pet"
              data-value="cat" aria-pressed="false">🐱 猫派</button>
            <button class="choice" type="button" data-group="pet"
              data-value="both" aria-pressed="false">♡ どっちも好き</button>
          </div>
        </div>

        <div class="question">
          <span class="question-title">✧ おやくそく！</span>
          <div class="rule">
            <p>荒らし・迷惑行為は禁止だょ！</p>
            <div class="choices">
              <button class="choice" type="button" data-group="rules"
                data-value="yes" aria-pressed="false">💗 はーい！</button>
              <button class="choice" type="button" data-group="rules"
                data-value="no" aria-pressed="false">同意しない</button>
            </div>
          </div>
        </div>

        <button class="enter-button" type="submit">♡ すすむ ♡</button>
      </form>

      <div class="message" id="message" role="status" aria-live="polite">
        <h2>ごめんね 🥺</h2>
        <p>おやくそくに同意したら入室できるよ。</p>
        <button class="choice" id="back-button" type="button">
          もどる
        </button>
      </div>
    </section>

    <div class="footer">
      ♡ かわいい時間をすごしてね ♡
    </div>
  </main>

  <script>
    const yearSelect = document.getElementById("birth-year");
    const currentYear = new Date().getFullYear();

    for (let year = currentYear; year >= 1970; year--) {
      const option = document.createElement("option");
      option.value = String(year);
      option.textContent = year + "年";
      yearSelect.appendChild(option);
    }

    const answers = {
      gender: null,
      pet: null,
      rules: null
    };

    document.querySelectorAll("[data-group]").forEach(button => {
      button.addEventListener("click", () => {
        const group = button.dataset.group;
        answers[group] = button.dataset.value;

        document.querySelectorAll(
          '[data-group="' + group + '"]'
        ).forEach(item => {
          item.setAttribute(
            "aria-pressed",
            item === button ? "true" : "false"
          );
        });
      });
    });

    const form = document.getElementById("entry-form");
    const message = document.getElementById("message");
    const entrance = document.getElementById("entrance");

    form.addEventListener("submit", event => {
      event.preventDefault();

      if (!yearSelect.value) {
        alert("生まれ年を選んでね♡");
        yearSelect.focus();
        return;
      }

      if (answers.rules === "no") {
        form.style.display = "none";
        message.style.display = "block";
        return;
      }

      if (answers.rules !== "yes") {
        alert("おやくそくを選んでね♡");
        return;
      }

      const selectedYear = yearSelect.value;

      // 生まれ年だけで行き先を決める
      if (selectedYear !== "before1970") {
        const year = Number(selectedYear);

        if (year >= 1990 && year <= 1999) {
          window.location.href = "index.html";
          return;
        }
      }

      window.location.href = "popbbs.html";
    });

    document.getElementById("back-button").addEventListener("click", () => {
      message.style.display = "none";
      form.style.display = "block";
      answers.rules = null;

      document.querySelectorAll('[data-group="rules"]').forEach(button => {
        button.setAttribute("aria-pressed", "false");
      });
    });
  </script>
</body>
</html>
