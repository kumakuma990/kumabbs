
<script>
  const y = document.getElementById("birth-year");
  const n = new Date().getFullYear();
  const STORAGE_KEY = "kumabbs_entry_answers";

  for (let i = n; i >= 1970; i--) {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = i + "年";
    y.appendChild(o);
  }

  const a = {
    g: null,
    p: null,
    r: null,
    children: null
  };

  const f = document.getElementById("entry-form");
  const m = document.getElementById("message");

  function goToBoard(answers) {
    const year = Number(answers.year);

    if (
      year >= 1985 &&
      year <= 1999 &&
      answers.children === "1"
    ) {
      window.location.href = "index.html";
    } else {
      window.location.href = "popbbs.html";
    }
  }

  // 保存済みの回答があれば、質問を表示せず自動で移動
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      const answers = JSON.parse(saved);

      if (
        answers &&
        answers.r === "1" &&
        answers.year &&
        answers.g &&
        answers.p &&
        answers.children
      ) {
        goToBoard(answers);
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    }
  } catch (error) {
    console.log("保存した回答を読み込めませんでした。");
  }

  document.querySelectorAll("[data-g]").forEach(b => {
    b.addEventListener("click", () => {
      const k = b.dataset.g;
      a[k] = b.dataset.v;

      document.querySelectorAll('[data-g="' + k + '"]')
        .forEach(c => {
          c.setAttribute(
            "aria-pressed",
            c === b ? "true" : "false"
          );
        });
    });
  });

  f.addEventListener("submit", e => {
    e.preventDefault();

    if (!y.value) {
      alert("生まれ年を選んでね♡");
      y.focus();
      return;
    }

    if (a.r === "0") {
      f.style.display = "none";
      m.style.display = "block";
      return;
    }

    if (a.r !== "1") {
      alert("おやくそくを選んでね♡");
      return;
    }

    if (!a.children) {
      alert("お子さんについて選んでね♡");
      return;
    }

    if (!a.g) {
      alert("性別を選んでね♡");
      return;
    }

    if (!a.p) {
      alert("犬派か猫派か選んでね♡");
      return;
    }

    const answers = {
      year: y.value,
      g: a.g,
      p: a.p,
      r: a.r,
      children: a.children
    };

    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(answers)
      );
    } catch (error) {
      console.log("回答を保存できませんでした。");
    }

    goToBoard(answers);
  });

  document.getElementById("back").addEventListener("click", () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      m.innerHTML = `
        <h2>Bye-bye！</h2>
        <p>遊びに来てくれてありがとう！</p>
        <p>このページはボタンから閉じられないことがあるよ。
        ブラウザのタブを閉じてね♡</p>
      `;
    }
  });
</script>
