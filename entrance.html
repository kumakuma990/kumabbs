
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>えんとらんす</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px 40px;
      background: #FFF0F5;
      color: #8D536B;
      font-family: "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.8;
    }

    button, select { font: inherit; }

    .page {
      max-width: 560px;
      margin: auto;
    }

    .decoration {
      text-align: center;
      color: #D987A8;
      letter-spacing: 5px;
      margin: 8px 0;
    }

    .card {
      background: #FFF;
      border: 2px solid #F5D5E2;
      border-radius: 22px;
      padding: 26px 20px;
      box-shadow: 0 7px 0 #F6DDE7;
    }
.title-area {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 24px;
}

.title-bunny {
  position: absolute;
  right: 80px;
  width: 64px;
  height: 74px;
  object-fit: contain;
}

.title-text {
  min-width: 0;
  text-align: center;
}

.title-text h1 {
  font-size: 18px;
  letter-spacing: 1px;
  text-align: center;
}

.title-text .subtitle {
  font-size: 13px;
  text-align: center;
  margin: 4px 0 0;
}
    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      color: #D77FA1;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      margin: 4px 0 24px;
      color: #B77B94;
    }

    .mascot {
      width: 100px;
      height: 100px;
      margin: 0 auto 14px;
      border: 2px dashed #EFC4D5;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #D99AB3;
      background: #FFF8FB;
      font-size: 13px;
      text-align: center;
    }

    .question { margin: 22px 0; }

    .question-title {
      display: block;
      font-weight: bold;
      margin-bottom: 9px;
      color: #B96588;
    }

    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #EBC5D5;
      border-radius: 12px;
      background: #FFF8FB;
      color: #8D536B;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice {
      flex: 1 1 auto;
      min-width: 90px;
      padding: 9px 12px;
      border: 1px solid #EBC5D5;
      border-radius: 14px;
      background: #FFF;
      color: #A65F7D;
      cursor: pointer;
    }

    .choice[aria-pressed="true"] {
      background: #F6C9DB;
      border-color: #E49AB8;
      color: #79415A;
      font-weight: bold;
    }

    .rule {
      padding: 15px;
      background: #FFF5F9;
      border: 1px solid #F4D8E4;
      border-radius: 14px;
      text-align: center;
    }

    .rule p { margin: 0 0 12px; font-weight: bold; }

    .enter {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 999px;
      background: #E99BB9;
      color: #FFF;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #D77FA1;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #FFF5F9;
      text-align: center;
    }

    .message h2 { color: #D77FA1; }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #B98BA0;
      margin-top: 24px;
    }

    @media (max-width: 380px) {
      .card { padding: 22px 14px; }
      h1 { font-size: 26px; }
      .choice { min-width: 75px; padding: 8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="decoration">♡ 　 ♡ 　 ♡</div>

    <section class="card">
<div class="title-area">
  <div class="title-text">
    <h1>♡ あてんしょん ♡</h1>
    <p class="subtitle">簡単なアンケートのお願い♡</p>
  </div>
  <img src="images/usagi/base.png" alt="うさぎちゃん" class="title-bunny">
</div>

      <form id="entry-form">
        <div class="question">
          <label class="question-title" for="birth-year">
            ✧ 生まれ年は？
          </label>
          <select id="birth-year" required>
            <option value="">選んでね♡</option>
            <option value="old">1960年代以前</option>
          </select>
        </div>

        <div class="question">
          <span class="question-title">✧ 性別は？</span>
          <div class="choices">
            <button class="choice" type="button" data-g="g" data-v="1" aria-pressed="false">女の子</button>
            <button class="choice" type="button" data-g="g" data-v="2" aria-pressed="false">男の子</button>
            <button class="choice" type="button" data-g="g" data-v="3" aria-pressed="false">その他</button>
            <button class="choice" type="button" data-g="g" data-v="4" aria-pressed="false">答えない</button>
          </div>
        </div>

        <div class="question">
          <span class="question-title">✧ 犬派？猫派？</span>
          <div class="choices">
            <button class="choice" type="button" data-g="p" data-v="1" aria-pressed="false">犬派</button>
            <button class="choice" type="button" data-g="p" data-v="2" aria-pressed="false">猫派</button>
            <button class="choice" type="button" data-g="p" data-v="3" aria-pressed="false">どっちも！</button>
          </div>
        </div>

        <div class="question">
          <span class="question-title">✧ おやくそく！</span>
          <div class="rule">
            <p>荒らし・迷惑行為は禁止だょ！</p>
            <div class="choices">
              <button class="choice" type="button" data-g="r" data-v="1" aria-pressed="false">はーい！</button>
              <button class="choice" type="button" data-g="r" data-v="0" aria-pressed="false">同意しない</button>
            </div>
          </div>
        </div>

        <button class="enter" type="submit">♡ すすむ ♡</button>
      </form>

      <div class="message" id="message" role="status" aria-live="polite">
        <h2>Bye-bye！</h2>
        <p>遊びに来てくれてありがとう！</p>
        <button class="choice" id="back" type="button">とじる</button>
      </div>
    </section>

    <div class="footer">♡ かわいい時間をすごしてね ♡</div>
  </main>

  <script>
    const y = document.getElementById("birth-year");
    const n = new Date().getFullYear();

    for (let i = n; i >= 1970; i--) {
      const o = document.createElement("option");
      o.value = String(i);
      o.textContent = i + "年";
      y.appendChild(o);
    }

    const a = { g: null, p: null, r: null };

    document.querySelectorAll("[data-g]").forEach(b => {
      b.addEventListener("click", () => {
        const k = b.dataset.g;
        a[k] = b.dataset.v;

        document.querySelectorAll('[data-g="' + k + '"]').forEach(c => {
          c.setAttribute("aria-pressed", c === b ? "true" : "false");
        });
      });
    });

    const f = document.getElementById("entry-form");
    const m = document.getElementById("message");

    f.addEventListener("submit", e => {
      e.preventDefault();

      if (!y.value) {
        alert("生まれ年を選んでね♡");
        y.focus();
        return;
      }

      if (a.r === "0") {
        f.style.display = "none";
        m.style.display = "block";
        return;
      }

      if (a.r !== "1") {
        alert("おやくそくを選んでね♡");
        return;
      }

      const v = y.value;

      if (v !== "old") {
        const z = Number(v);

        if (z >= 1990 && z <= 1999) {
          window.location.href = "index.html";
          return;
        }
      }

      window.location.href = "popbbs.html";
    });

    document.getElementById("back").addEventListener("click", () => {
      m.style.display = "none";
      f.style.display = "block";
      a.r = null;

      document.querySelectorAll('[data-g="r"]').forEach(b => {
        b.setAttribute("aria-pressed", "false");
      });
    });
  </script>
</body>
</html>
